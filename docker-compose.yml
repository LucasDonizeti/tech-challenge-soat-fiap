version: '3.8'

services:
  # Serviço da aplicação Java
  app:
    build:
      context: ./oficina
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/oficina?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_JPA_SHOW_SQL=true
    depends_on:
      - mysql
    networks:
      - app-network

  # Serviço do banco de dados MySQL
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=oficina
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network

# Volumes para persistência de dados
volumes:
  mysql_data:

# Rede para comunicação entre os containers
networks:
  app-network:
    driver: bridge
