# ==============================================================================
# values.yaml — valores padrão (ambiente de desenvolvimento/local)
# Para produção, sobrescreva com: helm install -f values-prod.yaml
# ==============================================================================

replicaCount: 1

image:
  repository: oficina-api
  pullPolicy: IfNotPresent
  # Sobrescrever na pipeline: --set image.tag=<git-sha>
  tag: "2.0.5"

imagePullSecrets:
  - name: aws-ecr-secret

nameOverride: ""
fullnameOverride: "oficina-api"

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: NodePort
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: oficina-api.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - oficina-api.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /


resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "2Gi"
    cpu: "1"

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  initialDelaySeconds: 30
  periodSeconds: 15
  failureThreshold: 3
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
  initialDelaySeconds: 20
  periodSeconds: 10
  failureThreshold: 3
  timeoutSeconds: 5

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

configmap:
  SPRING_PORT: "8080"
  SPRING_APPLICATION_NAME: "oficina-api-dev"
  SPRING_APPLICATION_VERSION: "2.0.5"
  SPRING_JPA_SHOW_SQL: "false"
  SPRING_HIBERNATE_DIALECT: "org.hibernate.dialect.MySQLDialect"
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: "com.mysql.cj.jdbc.Driver"
  LOG_LEVEL: "INFO"
  SECURITY_LOG_LEVEL: "WARN"
  JWT_LOG_LEVEL: "ERROR"
  JWT_EXPIRATION: "3600"
  SECURITY_USER_ROLES: "ADMIN"

secret:
  SPRING_DATASOURCE_URL: "jdbc:mysql://host.docker.internal:3306/oficina?useSSL=false&allowPublicKeyRetrieval=true"
  SPRING_DATASOURCE_USERNAME: "user"
  SPRING_DATASOURCE_PASSWORD: "password"
  JWT_SECRET: "superchavesecretajwtdepelomenostrintaedoiscaracteres"
  SECURITY_USER_NAME: "admin"
  SECURITY_USER_PASSWORD: "senhasenha"

extraEnv: []

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
