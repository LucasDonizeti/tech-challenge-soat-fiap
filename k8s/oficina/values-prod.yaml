# ==============================================================================
# values-prod.yaml — sobrescreve values.yaml para ambiente de produção (AWS EKS)
# Uso na pipeline:
#   helm upgrade --install oficina ./k8s/oficina \
#     -f k8s/oficina/values-prod.yaml \
#     --set image.tag=$IMAGE_TAG \
#     --set secret.SPRING_DATASOURCE_URL=$SPRING_DATASOURCE_URL \
#     --set secret.SPRING_DATASOURCE_USERNAME=$SPRING_DATASOURCE_USERNAME \
#     --set secret.SPRING_DATASOURCE_PASSWORD=$SPRING_DATASOURCE_PASSWORD \
#     --set secret.JWT_SECRET=$JWT_SECRET \
#     --set secret.SECURITY_USER_NAME=$SECURITY_USER_NAME \
#     --set secret.SECURITY_USER_PASSWORD=$SECURITY_USER_PASSWORD
# ==============================================================================

replicaCount: 2

image:
  repository: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/oficina-api
  pullPolicy: Always
  tag: "latest"

service:
  type: NodePort
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30080

imagePullSecrets:
  - name: aws-ecr-secret

nameOverride: ""
fullnameOverride: "oficina-api"

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

ingress:
  enabled: false

httpRoute:
  enabled: false

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "2Gi"
    cpu: "1"

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  initialDelaySeconds: 30
  periodSeconds: 15
  failureThreshold: 3
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
  initialDelaySeconds: 20
  periodSeconds: 10
  failureThreshold: 3
  timeoutSeconds: 5

configmap:
  SPRING_PORT: "8080"
  SPRING_APPLICATION_NAME: "oficina-api-prod"
  SPRING_APPLICATION_VERSION: "2.0.5"
  SPRING_JPA_SHOW_SQL: "false"
  SPRING_HIBERNATE_DIALECT: "org.hibernate.dialect.MySQLDialect"
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: "com.mysql.cj.jdbc.Driver"
  LOG_LEVEL: "INFO"
  SECURITY_LOG_LEVEL: "WARN"
  JWT_LOG_LEVEL: "ERROR"
  JWT_EXPIRATION: "3600"
  SECURITY_USER_ROLES: "ADMIN"

secret:
  SPRING_DATASOURCE_URL: ""
  SPRING_DATASOURCE_USERNAME: ""
  SPRING_DATASOURCE_PASSWORD: ""
  JWT_SECRET: ""
  SECURITY_USER_NAME: ""
  SECURITY_USER_PASSWORD: ""

extraEnv: []
