apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oficina.fullname" . }}
  labels:
    {{- include "oficina.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "oficina.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "oficina.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "oficina.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      # 1. INIT CONTAINER: Baixa/copia o newrelic.jar para o volume em memória
      initContainers:
        - name: newrelic-java-init
          image: newrelic/newrelic-java-init:9.4.0
          command: ['sh', '-c', 'cp -r /fig/* /opt/newrelic/ || cp -r /newrelic/* /opt/newrelic/ || cp /newrelic-agent.jar /opt/newrelic/newrelic.jar']
          volumeMounts:
            - name: newrelic-agent
              mountPath: /opt/newrelic

      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ (index .Values.service.ports 0).targetPort }}
              protocol: TCP
          
          # Variáveis do ConfigMap e Secret
          envFrom:
            - configMapRef:
                name: {{ include "oficina.fullname" . }}-configmap
            - secretRef:
                name: {{ include "oficina.fullname" . }}-secret
          
          # Injeção do JAVA_TOOL_OPTIONS e mesclagem com extraEnv
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/opt/newrelic/newrelic.jar"
          {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          
          # 2. MOUNT DO AGENTE: Conecta a pasta montada no container da aplicação
          volumeMounts:
            - name: newrelic-agent
              mountPath: /opt/newrelic
            {{- if .Values.volumeMounts }}
            {{- toYaml .Values.volumeMounts | nindent 12 }}
            {{- end }}

          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

      # 3. VOLUME COMPARTILHADO: Pasta emptyDir para trocar o jar entre os containers
      volumes:
        - name: newrelic-agent
          emptyDir: {}
        {{- if .Values.volumes }}
        {{- toYaml .Values.volumes | nindent 8 }}
        {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}