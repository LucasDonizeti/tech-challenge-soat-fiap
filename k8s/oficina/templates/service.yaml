apiVersion: v1
kind: Service
metadata:
  name: {{ include "oficina.fullname" . }}
  labels:
    {{- include "oficina.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.ports[0].port }}
      targetPort: {{ .Values.service.ports[0].targetPort }}
      protocol: TCP
      name: http
      {{- if and (eq .Values.service.type "NodePort") .Values.service.ports[0].nodePort }}
      nodePort: {{ .Values.service.ports[0].nodePort }}
      {{- end }}
  selector:
    {{- include "oficina.selectorLabels" . | nindent 4 }}
