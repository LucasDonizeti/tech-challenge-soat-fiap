apiVersion: v1
kind: ConfigMap
metadata:
  name: app-configmap-dev
data:
  SPRING_PORT: "8080"
  SPRING_APPLICATION_NAME: "oficina-api-dev"
  SPRING_APPLICATION_VERSION: "2.0.0"

  SPRING_JPA_SHOW_SQL: "false"
  SPRING_HIBERNATE_DIALECT: "org.hibernate.dialect.MySQLDialect"
  LOG_LEVEL: "INFO"
  SECURITY_LOG_LEVEL: "WARN"
  JWT_LOG_LEVEL: "ERROR"

  JWT_EXPIRATION: "3600"
  SECURITY_USER_ROLES: "ADMIN"

