name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: oficina-api
  TF_STATE_BUCKET: bucket-tfstate-1029
  TF_STATE_KEY: global/s3/terraform.tfstate
  TF_DYNAMODB_TABLE: meu-terraform-state-lock
  EKS_CLUSTER_NAME: oficina-cluster
  HELM_RELEASE_NAME: oficina
  HELM_CHART_PATH: k8s/oficina
  K8S_NAMESPACE: default

jobs:
  # JOB 1 — Build + Testes
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: maven

      - name: Build e testes com Maven
        run: mvn -B verify --file pom.xml
        working-directory: ./oficina

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: oficina/target/*.jar
          retention-days: 1

  # JOB 2 — Bootstrap Terraform (S3 + DynamoDB + ECR)
  terraform-bootstrap:
    name: Bootstrap Terraform Backend
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Verificar se o bucket S3 já existe
        id: check-bucket
        run: |
          if aws s3api head-bucket --bucket ${{ env.TF_STATE_BUCKET }} 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Bucket já existe, pulando bootstrap"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Bucket não existe, executando bootstrap"
          fi

      - name: Terraform Init (Bootstrap)
        if: steps.check-bucket.outputs.exists == 'false'
        run: terraform init
        working-directory: terraform/bootstrap

      - name: Terraform Apply (Bootstrap)
        if: steps.check-bucket.outputs.exists == 'false'
        run: terraform apply -auto-approve
        working-directory: terraform/bootstrap

  # JOB 3 — Build e push da imagem Docker para o ECR
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: terraform-bootstrap
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: oficina/target

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Definir tag da imagem
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "image_tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Tag da imagem: ${SHORT_SHA}"

      - name: Build e push da imagem Docker
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            ./oficina
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "Imagem publicada: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  # JOB 4 — Terraform Plan (VPC + RDS + EKS)
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ env.TF_DYNAMODB_TABLE }}" \
            -backend-config="encrypt=true"
        working-directory: terraform

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="db_username=${{ secrets.DB_USERNAME }}" \
            -out=tfplan
        working-directory: terraform

      - name: Salvar Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan
          retention-days: 1

    # JOB 5 — Terraform Apply
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    outputs:
      rds_endpoint: ${{ steps.tf-outputs.outputs.rds_endpoint }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ env.TF_DYNAMODB_TABLE }}" \
            -backend-config="encrypt=true"
        working-directory: terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        working-directory: terraform

      - name: Capturar outputs do Terraform
        id: tf-outputs
        run: |
          echo "rds_endpoint=$(terraform output -raw rds_endpoint)" >> $GITHUB_OUTPUT
        working-directory: terraform

      - name: Configurar kubectl
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER_NAME }}

  # JOB 6 — Deploy com Helm no EKS
  deploy:
    name: Deploy Helm → EKS
    runs-on: ubuntu-latest
    needs: [ docker, terraform-apply ]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar kubectl para o EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Buscar senha do RDS no Secrets Manager
        id: rds-secret
        run: |
          SECRET_ARN=$(aws rds describe-db-instances \
            --db-instance-identifier oficina-rds \
            --query 'DBInstances[0].MasterUserSecret.SecretArn' \
            --output text)
          DB_PASSWORD=$(aws secretsmanager get-secret-value \
            --secret-id "$SECRET_ARN" \
            --query 'SecretString' \
            --output text | python3 -c "import sys,json; print(json.load(sys.stdin)['password'])")
          echo "::add-mask::$DB_PASSWORD"
          echo "db_password=$DB_PASSWORD" >> $GITHUB_OUTPUT

      - name: Criar/atualizar imagePullSecret do ECR
        env:
          ECR_REGISTRY: ${{ needs.docker.outputs.ecr_registry }}
        run: |
          ECR_PASSWORD=$(aws ecr get-login-password --region ${{ env.AWS_REGION }})
          kubectl create secret docker-registry aws-ecr-secret \
            --docker-server=$ECR_REGISTRY \
            --docker-username=AWS \
            --docker-password=$ECR_PASSWORD \
            --namespace=${{ env.K8S_NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Helm upgrade --install
        env:
          ECR_REGISTRY: ${{ needs.docker.outputs.ecr_registry }}
          IMAGE_TAG: ${{ needs.docker.outputs.image_tag }}
          RDS_ENDPOINT: ${{ needs.terraform-apply.outputs.rds_endpoint }}
          DB_PASSWORD: ${{ steps.rds-secret.outputs.db_password }}
        run: |
          helm upgrade --install ${{ env.HELM_RELEASE_NAME }} ${{ env.HELM_CHART_PATH }} \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --create-namespace \
            -f ${{ env.HELM_CHART_PATH }}/values-prod.yaml \
            --set image.repository=$ECR_REGISTRY/${{ env.ECR_REPOSITORY }} \
            --set image.tag=$IMAGE_TAG \
            --set secret.SPRING_DATASOURCE_URL="jdbc:mysql://${RDS_ENDPOINT}:3306/oficina?useSSL=true&requireSSL=true" \
            --set secret.SPRING_DATASOURCE_USERNAME="${{ secrets.DB_USERNAME }}" \
            --set secret.SPRING_DATASOURCE_PASSWORD="$DB_PASSWORD" \
            --set secret.JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --set secret.SECURITY_USER_NAME="${{ secrets.SECURITY_USER_NAME }}" \
            --set secret.SECURITY_USER_PASSWORD="${{ secrets.SECURITY_USER_PASSWORD }}" \
            --atomic \
            --timeout 10m \
            --wait

      - name: Verificar rollout do deployment
        run: |
          kubectl rollout status deployment/oficina-api \
            --namespace=${{ env.K8S_NAMESPACE }} \
            --timeout=5m
