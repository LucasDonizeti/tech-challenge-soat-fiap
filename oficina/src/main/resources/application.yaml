server:
  port: 8080

spring:
  application:
    name: oficina
    version: 1.0.0

  # Configurações do Swagger/OpenAPI - Conforme ADR-014
  springdoc:
    api-docs:
      path: /v3/api-docs
    swagger-ui:
      path: /swagger-ui.html
      enabled: true
    show-actuator: false

  datasource:
    url: jdbc:mysql://localhost:3306/oficina?useSSL=false&allowPublicKeyRetrieval=true
    username: user
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  security:
    jwt:
      secret: chavesecreta
      expiration: 86400

    user:
      name: admin
      password: secret123
      roles: ADMIN

logging:
  level:
    com.techchallenge.oficina: INFO
    org.springframework.security: DEBUG
    io.jsonwebtoken: DEBUG
