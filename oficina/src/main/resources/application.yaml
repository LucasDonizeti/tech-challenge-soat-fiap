server:
  port: 8080

spring:
  application:
    name: oficina
  
  datasource:
    url: jdbc:mysql://localhost:3306/oficina?useSSL=false&allowPublicKeyRetrieval=true
    username: user
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  security:
    jwt:
      secret: chavesecreta
      expiration: 86400

    user:
      name: admin
      password: secret123
      roles: ADMIN

logging:
  level:
    com.techchallenge.oficina: INFO
    org.springframework.security: DEBUG
    io.jsonwebtoken: DEBUG
