# Configurações de teste
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Desabilitar Flyway para testes (Hibernate cria as tabelas)
spring.flyway.enabled=false

# Configuração para isolamento completo entre testes
spring.test.database.replace=none
spring.jpa.defer-datasource-initialization=true

# Configurações de segurança para testes
spring.security.user.name=admin
spring.security.user.password=secret123
spring.security.user.roles=ADMIN
spring.security.jwt.secret=chavesecreta
spring.security.jwt.expiration=86400

# Logging
logging.level.com.techchallenge.oficina=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
